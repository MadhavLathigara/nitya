# Builds the app and puts the finished files on the "gh-pages" branch.
# GitHub Pages then shows that branch (Settings → Pages → Deploy from a branch → gh-pages / root).
# Runs on every push to "main", or by hand from the Actions tab.
# Checkout and Node actions are pinned to exact commits for safety (comment shows the version).
name: Build and publish to gh-pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish to gh-pages branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "Madhav Lathigara"
          git config user.email "lathigara.madhav@gmail.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
